<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/></head>
<body style="font-family: Arial, sans-serif; background: #f3f4f6;">
    <table width="600" cellpadding="0" cellspacing="0" align="center"
           style="background: white; border-radius: 12px; margin: 40px auto;">
        <tr>
            <td style="background: linear-gradient(135deg, #10b981, #059669);
                        padding: 40px; text-align: center;">
                <h1 style="color: white; margin: 0;">
                    🎉 Congratulations!
                </h1>
            </td>
        </tr>
        <tr>
            <td style="padding: 40px;">
                <p>Dear <strong th:text="${candidateName}"></strong>,</p>
                <p style="color: #6b7280; line-height: 1.6;">
                    We are pleased to extend an offer of employment with
                    <strong th:text="${companyName}"></strong>. Please find
                    your offer letter attached to this email.
                </p>
                <div style="background: #ecfdf5; padding: 15px;
                            border-radius: 8px; margin: 20px 0;
                            border-left: 4px solid #10b981;">
                    <p style="margin: 0; color: #065f46;">
                        <strong>Offer Number:</strong>
                        <span th:text="${offerNumber}"></span>
                    </p>
                </div>
                <p style="color: #6b7280;">
                    Please review the offer carefully and respond within
                    the validity period.
                </p>
            </td>
        </tr>
        <tr>
            <td style="background: #f9fafb; padding: 20px;
                        text-align: center; font-size: 12px;">
                © 2026 <span th:text="${companyName}"></span>
            </td>
        </tr>
    </table>
</body>
</html>
