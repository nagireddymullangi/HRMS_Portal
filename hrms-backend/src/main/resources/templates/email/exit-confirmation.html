<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/></head>
<body style="font-family: Arial, sans-serif; background: #f3f4f6;">
    <table width="600" cellpadding="0" cellspacing="0" align="center"
           style="background: white; border-radius: 12px; margin: 40px auto;">
        <tr>
            <td style="background: #f59e0b; padding: 40px; text-align: center;">
                <h1 style="color: white; margin: 0;">Exit Process Initiated</h1>
            </td>
        </tr>
        <tr>
            <td style="padding: 40px;">
                <p>Dear <strong th:text="${employeeName}"></strong>,</p>
                <p style="color: #6b7280;">
                    Your exit process has been initiated. Your last
                    working day will be
                    <strong th:text="${lastWorkingDate}"></strong>.
                </p>
                <p style="color: #6b7280;">
                    The HR team will guide you through the clearance
                    process and final settlement.
                </p>
            </td>
        </tr>
    </table>
</body>
</html>
